<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOR Red Neuronal en JS</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        .result-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            margin-top: 15px;
        }
        #log {
            font-family: monospace;
            background: #212529;
            color: #00ff00;
            padding: 15px;
            border-radius: 6px;
            height: 140px;
            overflow-y: auto;
            font-size: 13px;
            margin-bottom: 15px;
        }
        select {
            padding: 8px;
            font-size: 16px;
            border-radius: 6px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Perceptron XOR</h1>
        <button id="btnTrain">Comenzar Entrenamiento (20,000 épocas)</button>
    </div>

    <div class="card">
        <h2>Entrenamiento</h2>
        <div id="log"></div>
    </div>

    <div class="card" id="testSection" style="display: none;">
        <h2>Probar la Red Neuronal</h2>
        <label for="x1">Entrada 1:</label>
        <select id="x1">
            <option value="0">0</option>
            <option value="1">1</option>
        </select>

        <label for="x2">Entrada 2:</label>
        <select id="x2">
            <option value="0">0</option>
            <option value="1">1</option>
        </select>

        <div class="result-box" id="predictionResult">
            Elige valores para predecir.
        </div>
    </div>

    <script src="neurona.js"></script>
</body>
</html>
